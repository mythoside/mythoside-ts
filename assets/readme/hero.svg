<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Mythos Desktop, the app novelists write in</title>
  <desc id="desc">A simplified view of the app: the series tree with a chapter selected, the chapter text, and a character card listing the chapters that mention her.</desc>
  <defs>
    <mask id="writing" maskUnits="userSpaceOnUse" x="-24" y="-10" width="600" height="600">
      <rect x="-24" y="-10" width="600" height="600" fill="#fff"/>
      <path d="M214 248L388 262M186 298L406 320M162 348L326 370" stroke="#000" stroke-width="20" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="1200" height="400" rx="24" fill="#F8F6F0"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="23.5" fill="none" stroke="#E5DFD4"/>
<g transform="translate(64 56) scale(0.0667) translate(24 10)">
    <polygon points="217,4 88,356 226,186 390,184 506,500 104,395 6,494 26,205 49,139" mask="url(#writing)" fill="#A35A3C" stroke="#A35A3C" stroke-width="28" stroke-linejoin="round"/>
    <path d="M120 446L482 545M170 498L452 575" stroke="#A35A3C" stroke-width="22" stroke-linecap="round"/>
  </g>
  <text x="116" y="85" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#8A847B" text-anchor="start">mythoside / mythoside-ts</text>
  <text x="64" y="172" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="54" font-weight="500" fill="#2A2724" text-anchor="start">Mythos Desktop</text>
  <text x="64" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="24" font-weight="400" fill="#55504A" text-anchor="start">Where you write: the tree of your</text>
  <text x="64" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="24" font-weight="400" fill="#55504A" text-anchor="start">series, the page, and who is in it</text>
  <text x="64" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#8A847B" text-anchor="start">Tauri 2 · React 19 · TypeScript</text>
  <rect x="600" y="48" width="536" height="304" rx="14" fill="#FFFFFF" stroke="#E5DFD4"/>
  <line x1="812" y1="48" x2="812" y2="352" stroke="#E5DFD4"/>
  <text x="624" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="500" fill="#2A2724" text-anchor="start">The Drowned Throne</text>
  <text x="640" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="400" fill="#55504A" text-anchor="start">1-saltlight.md</text>
  <rect x="612" y="148" width="188" height="34" rx="8" fill="#F1ECE3"/>
  <text x="640" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="400" fill="#2A2724" text-anchor="start">3-tidewatch.md</text>
  <text x="624" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="500" fill="#2A2724" text-anchor="start">Characters</text>
  <text x="640" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="400" fill="#55504A" text-anchor="start">Sera of Vael</text>
  <text x="640" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="400" fill="#55504A" text-anchor="start">Lord Corvath</text>
  <text x="836" y="100" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="28" font-weight="500" fill="#2A2724" text-anchor="start">The Tidewatch</text>
  <text x="836" y="144" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="21" font-weight="400" fill="#55504A" text-anchor="start">Sera reached the Tidewatch</text>
  <text x="836" y="176" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="21" font-weight="400" fill="#55504A" text-anchor="start">before dawn. Behind her,</text>
  <text x="836" y="208" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="21" font-weight="400" fill="#55504A" text-anchor="start">Embergate was still burning.</text>
  <rect x="836" y="248" width="272" height="80" rx="10" fill="#F8F6F0" stroke="#E5DFD4"/>
  <circle cx="858" cy="276" r="6" fill="#A35A3C"/>
  <text x="874" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="19" font-weight="500" fill="#2A2724" text-anchor="start">Sera of Vael</text>
  <text x="852" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="400" fill="#8A847B" text-anchor="start">mentioned in ch-01, ch-03</text>
</svg>
